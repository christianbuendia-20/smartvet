<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(title='SmartVet — Mis Citas')}"></head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">

    <div class="page-header" style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
        <div>
            <h2>Mis Citas</h2>
            <p>Historial completo de citas de <strong sec:authentication="principal.nombreCompleto">Cliente</strong>.</p>
        </div>
        <a th:href="@{/cliente/citas/nueva}" class="btn btn-verde">+ Agendar cita</a>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${mensajeExito}" class="alerta alerta-exito" th:text="${mensajeExito}"></div>

    <div class="tabla-card">
        <table th:if="${not #lists.isEmpty(citas)}">
            <thead>
                <tr>
                    <th>Fecha y hora</th>
                    <th>Mascota</th>
                    <th>Veterinario</th>
                    <th>Tipo</th>
                    <th>Motivo</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cita : ${citas}">
                    <td>
                        <strong th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy')}">-</strong>
                        <span style="color:var(--texto-suave); font-size:0.82rem;"
                              th:text="${' ' + #temporals.format(cita.fechaHora, 'HH:mm')}"></span>
                    </td>
                    <td>
                        <strong th:text="${cita.mascota.nombre}">-</strong>
                        <span style="color:var(--texto-suave); font-size:0.8rem;"
                              th:text="' (' + ${cita.mascota.especie} + ')'"></span>
                    </td>
                    <td th:text="${cita.veterinario.usuario.nombres + ' ' + cita.veterinario.usuario.apellidos}">-</td>
                    <td th:text="${cita.tipoCita}">-</td>
                    <td style="max-width:160px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"
                        th:text="${cita.motivo ?: '—'}">—</td>
                    <td>
                        <span class="badge"
                              th:text="${cita.estado}"
                              th:classappend="${' badge-' + cita.estado.name().toLowerCase().replace('_', '-')}">
                        </span>
                    </td>
                    <td>
                        <form th:if="${cita.estado.name() == 'PROGRAMADA' or cita.estado.name() == 'CONFIRMADA'}"
                              th:action="@{/cliente/citas/{id}/cancelar(id=${cita.idCita})}"
                              method="post"
                              onsubmit="return confirm('¿Confirmas la cancelación de esta cita?')">
                            <button type="submit" class="btn btn-peligro"
                                    style="padding:0.3rem 0.75rem; font-size:0.8rem;">
                                Cancelar
                            </button>
                        </form>
                        <span th:if="${cita.estado.name() != 'PROGRAMADA' and cita.estado.name() != 'CONFIRMADA'}"
                              style="color:var(--texto-suave); font-size:0.85rem;">—</span>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="tabla-vacia" th:if="${#lists.isEmpty(citas)}">
            <span class="icono-vacio">📭</span>
            Aún no tienes ninguna cita registrada.
            <br>
            <a th:href="@{/cliente/citas/nueva}" style="margin-top:0.75rem; display:inline-block;">
                Agenda tu primera cita
            </a>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
