<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>SmartVet — Registrar Pago</title>
    <th:block th:insert="~{fragments/head :: head_content}"></th:block>
</head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">

    <div class="page-header" style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
        <div>
            <h2>Registrar Pago</h2>
            <p>Cita #<span th:text="${cita.idCita}">0</span></p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline">← Dashboard</a>
    </div>

    <!-- Error -->
    <div th:if="${errorForm}" class="alerta alerta-error" th:text="${errorForm}"></div>

    <!-- Resumen de la cita -->
    <div class="tabla-card" style="margin-bottom:1.5rem;">
        <p class="seccion-titulo" style="margin-bottom:0.75rem;">📋 Resumen de la Cita</p>
        <dl style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:0.5rem 1.5rem; margin:0;">
            <div>
                <dt style="font-size:0.78rem; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.04em;">Mascota</dt>
                <dd style="margin:0; font-weight:600;"
                    th:text="${cita.mascota.nombre + ' (' + cita.mascota.especie + ')'}">—</dd>
            </div>
            <div>
                <dt style="font-size:0.78rem; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.04em;">Propietario</dt>
                <dd style="margin:0;"
                    th:text="${cita.mascota.propietario.nombres + ' ' + cita.mascota.propietario.apellidos}">—</dd>
            </div>
            <div>
                <dt style="font-size:0.78rem; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.04em;">Veterinario</dt>
                <dd style="margin:0;"
                    th:text="${cita.veterinario.usuario.nombres + ' ' + cita.veterinario.usuario.apellidos}">—</dd>
            </div>
            <div>
                <dt style="font-size:0.78rem; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.04em;">Fecha y hora</dt>
                <dd style="margin:0;"
                    th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}">—</dd>
            </div>
            <div>
                <dt style="font-size:0.78rem; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.04em;">Tipo</dt>
                <dd style="margin:0;" th:text="${cita.tipoCita}">—</dd>
            </div>
            <div>
                <dt style="font-size:0.78rem; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.04em;">Motivo</dt>
                <dd style="margin:0;" th:text="${cita.motivo ?: '—'}">—</dd>
            </div>
        </dl>
    </div>

    <!-- Formulario de pago -->
    <div class="tabla-card">
        <p class="seccion-titulo" style="margin-bottom:1rem;">💳 Datos del Pago</p>

        <form th:action="@{/admin/pagos/registrar/{id}(id=${cita.idCita})}" method="post"
              style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:1rem 1.5rem;">

            <!-- Monto -->
            <div class="form-group">
                <label for="monto" class="form-label">Monto (S/) <span style="color:var(--rojo);">*</span></label>
                <input id="monto" name="monto" type="number" step="0.01" min="0.01"
                       class="form-input"
                       th:value="${montoPrev}"
                       placeholder="0.00" required>
            </div>

            <!-- Método de pago -->
            <div class="form-group">
                <label for="metodoPago" class="form-label">Método de pago <span style="color:var(--rojo);">*</span></label>
                <select id="metodoPago" name="metodoPago" class="form-input" required>
                    <option value="" disabled th:selected="${metodoPrev == null}">Seleccionar...</option>
                    <option th:each="metodo : ${metodos}"
                            th:value="${metodo.name()}"
                            th:text="${metodo.name()}"
                            th:selected="${metodoPrev != null and metodoPrev.name() == metodo.name()}">
                    </option>
                </select>
            </div>

            <!-- Referencia -->
            <div class="form-group">
                <label for="referencia" class="form-label">Referencia / N° operación</label>
                <input id="referencia" name="referencia" type="text"
                       class="form-input"
                       th:value="${referenciaPrev}"
                       placeholder="Opcional">
            </div>

            <!-- Observaciones (full width) -->
            <div class="form-group" style="grid-column: 1 / -1;">
                <label for="observaciones" class="form-label">Observaciones</label>
                <textarea id="observaciones" name="observaciones"
                          class="form-input" rows="3"
                          placeholder="Opcional"
                          th:text="${observacionesPrev}"></textarea>
            </div>

            <!-- Botones (full width) -->
            <div style="grid-column: 1 / -1; display:flex; gap:0.75rem; flex-wrap:wrap; margin-top:0.5rem;">
                <a th:href="@{/admin/pagos/pendientes}" class="btn btn-outline"
                   style="flex:1; min-width:130px; text-align:center;">Cancelar</a>
                <button type="submit" class="btn btn-verde"
                        style="flex:1; min-width:130px;">✅ Confirmar Pago</button>
            </div>

        </form>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
