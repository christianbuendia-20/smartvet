<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>SmartVet — Pagos Pendientes</title>
    <th:block th:insert="~{fragments/head :: head_content}"></th:block>
</head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">

    <div class="page-header" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
        <div>
            <h2>Pagos Pendientes</h2>
            <p th:text="${totalPendientes} + ' cita(s) completada(s) sin pago registrado'">0 citas pendientes</p>
        </div>
        <div style="display:flex; align-items:center; gap:0.75rem; flex-wrap:nowrap;">
            <a th:href="@{/admin/citas}" class="btn btn-primario"
               style="width:auto; font-size:0.875rem; padding:0.55rem 1.3rem; white-space:nowrap;">
                <i class="fa-solid fa-file-invoice-dollar"></i> Registrar Pago
            </a>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline"
               style="width:auto; font-size:0.875rem; padding:0.55rem 1.3rem; white-space:nowrap;">
                ← Dashboard
            </a>
        </div>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${mensajeExito}" class="alerta alerta-exito" th:text="${mensajeExito}"></div>
    <div th:if="${errorForm}"    class="alerta alerta-error"  th:text="${errorForm}"></div>

    <!-- Tabla de citas pendientes -->
    <div class="tabla-card">
        <table th:if="${not #lists.isEmpty(citasPendientes)}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Fecha</th>
                    <th>Mascota</th>
                    <th>Propietario</th>
                    <th>Veterinario</th>
                    <th>Tipo</th>
                    <th>Motivo</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cita : ${citasPendientes}">
                    <td th:text="${cita.idCita}">-</td>
                    <td th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}">-</td>
                    <td>
                        <strong th:text="${cita.mascota.nombre}">-</strong>
                        <span style="color:var(--texto-suave); font-size:0.8rem;"
                              th:text="' (' + ${cita.mascota.especie} + ')'"></span>
                    </td>
                    <td th:text="${cita.mascota.propietario.nombres + ' ' + cita.mascota.propietario.apellidos}">-</td>
                    <td th:text="${cita.veterinario.usuario.nombres + ' ' + cita.veterinario.usuario.apellidos}">-</td>
                    <td th:text="${cita.tipoCita}">-</td>
                    <td style="max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"
                        th:text="${cita.motivo ?: '—'}">—</td>
                    <td>
                        <div style="display:flex; flex-direction:column; gap:0.3rem; align-items:flex-start;">
                            <a th:href="@{/admin/citas/{id}(id=${cita.idCita})}"
                               class="btn btn-gris"
                               style="font-size:0.78rem; padding:0.25rem 0.75rem;">
                                <i class="fa-solid fa-eye"></i> Ver
                            </a>
                            <a th:href="@{/admin/pagos/registrar/{id}(id=${cita.idCita})}"
                               class="btn btn-primario"
                               style="font-size:0.78rem; padding:0.25rem 0.75rem;">
                                <i class="fa-solid fa-file-invoice-dollar"></i> Registrar Pago
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="tabla-vacia" th:if="${#lists.isEmpty(citasPendientes)}">
            <span class="icono-vacio">✅</span>
            No hay citas con pagos pendientes.
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
