<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(title='SmartVet — Pagos Pendientes')}"></head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">

    <div class="page-header" style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
        <div>
            <h2>Pagos Pendientes</h2>
            <p th:text="${totalPendientes} + ' cita(s) completada(s) sin pago registrado'">0 citas pendientes</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline">← Volver al Dashboard</a>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${mensajeExito}" class="alerta alerta-exito" th:text="${mensajeExito}"></div>
    <div th:if="${errorForm}"    class="alerta alerta-error"  th:text="${errorForm}"></div>

    <!-- Tabla de citas pendientes -->
    <div class="tabla-card">
        <table th:if="${not #lists.isEmpty(citasPendientes)}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Fecha</th>
                    <th>Mascota</th>
                    <th>Propietario</th>
                    <th>Veterinario</th>
                    <th>Tipo</th>
                    <th>Motivo</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cita : ${citasPendientes}">
                    <td th:text="${cita.idCita}">-</td>
                    <td th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}">-</td>
                    <td>
                        <strong th:text="${cita.mascota.nombre}">-</strong>
                        <span style="color:var(--texto-suave); font-size:0.8rem;"
                              th:text="' (' + ${cita.mascota.especie} + ')'"></span>
                    </td>
                    <td th:text="${cita.mascota.propietario.nombres + ' ' + cita.mascota.propietario.apellidos}">-</td>
                    <td th:text="${cita.veterinario.usuario.nombres + ' ' + cita.veterinario.usuario.apellidos}">-</td>
                    <td th:text="${cita.tipoCita}">-</td>
                    <td style="max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"
                        th:text="${cita.motivo ?: '—'}">—</td>
                    <td>
                        <a th:href="@{/admin/pagos/registrar/{id}(id=${cita.idCita})}"
                           class="btn btn-verde"
                           style="font-size:0.82rem; padding:0.3rem 0.75rem;">
                            💳 Registrar Pago
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="tabla-vacia" th:if="${#lists.isEmpty(citasPendientes)}">
            <span class="icono-vacio">✅</span>
            No hay citas con pagos pendientes.
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
