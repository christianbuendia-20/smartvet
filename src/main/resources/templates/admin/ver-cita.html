<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="|SmartVet — Cita #${cita.idCita}|">Ver Cita</title>
    <th:block th:insert="~{fragments/head :: head_content}"></th:block>
</head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">

    <div class="page-header" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
        <div>
            <h2 th:text="'Cita #' + ${cita.idCita}">Cita</h2>
            <p th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}">Fecha</p>
        </div>
        <div style="display:flex; gap:0.75rem; flex-wrap:nowrap; align-items:center;">
            <a th:if="${cita.estado.name() != 'COMPLETADA' and
                        cita.estado.name() != 'CANCELADA'  and
                        cita.estado.name() != 'NO_ASISTIO'}"
               th:href="@{/admin/citas/editar/{id}(id=${cita.idCita})}"
               class="btn btn-outline" style="white-space:nowrap;">
                <i class="fa-solid fa-pen-to-square"></i> Editar
            </a>
            <a th:href="@{/admin/citas}" class="btn btn-outline" style="white-space:nowrap;">
                ← Citas
            </a>
        </div>
    </div>

    <div style="max-width:720px; margin:0 auto;">
        <div class="tabla-card" style="padding:1.75rem 2rem;">
            <p class="seccion-titulo" style="margin-top:0; margin-bottom:1.25rem;">
                <i class="fa-regular fa-calendar-check" style="color:var(--primario);"></i>
                Detalle de la Cita
            </p>
            <dl class="ficha-grid">
                <div>
                    <dt>Fecha y hora</dt>
                    <dd th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}">-</dd>
                </div>
                <div>
                    <dt>Estado</dt>
                    <dd>
                        <span class="badge"
                              th:text="${cita.estado}"
                              th:classappend="${cita.estado.name() == 'PROGRAMADA'  ? ' badge-programada'  :
                                               cita.estado.name() == 'CONFIRMADA'  ? ' badge-confirmada'  :
                                               cita.estado.name() == 'EN_CURSO'    ? ' badge-en-curso'    :
                                               cita.estado.name() == 'COMPLETADA'  ? ' badge-completada'  :
                                               cita.estado.name() == 'CANCELADA'   ? ' badge-cancelada'   :
                                                                                     ' badge-no-asistio'}">
                        </span>
                    </dd>
                </div>
                <div>
                    <dt>Tipo de cita</dt>
                    <dd th:text="${cita.tipoCita}">-</dd>
                </div>
                <div>
                    <dt>Mascota</dt>
                    <dd th:text="${cita.mascota.nombre + ' (' + cita.mascota.especie + ')'}">-</dd>
                </div>
                <div>
                    <dt>Propietario</dt>
                    <dd th:text="${cita.mascota.propietario.nombres + ' ' + cita.mascota.propietario.apellidos}">-</dd>
                </div>
                <div>
                    <dt>Veterinario</dt>
                    <dd th:text="${cita.veterinario.usuario.nombres + ' ' + cita.veterinario.usuario.apellidos}">-</dd>
                </div>
                <div style="grid-column: 1 / -1;" th:if="${cita.motivo != null and !cita.motivo.isBlank()}">
                    <dt>Motivo</dt>
                    <dd th:text="${cita.motivo}">-</dd>
                </div>
            </dl>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
