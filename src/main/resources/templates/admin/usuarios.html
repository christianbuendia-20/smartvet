<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>SmartVet — Gestión de Usuarios</title>
    <th:block th:insert="~{fragments/head :: head_content}"></th:block>
</head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">

    <div class="page-header" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
        <div>
            <h2>Gestión de Usuarios</h2>
            <p>Consulta y cambia el rol de cada usuario registrado en el sistema.</p>
        </div>
        <div style="display:flex; align-items:center; gap:0.75rem; flex-wrap:nowrap;">
            <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primario"
               style="width:auto; font-size:0.875rem; padding:0.55rem 1.3rem; white-space:nowrap;">
                <i class="fa-solid fa-user-plus"></i> Nuevo Usuario
            </a>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline"
               style="width:auto; font-size:0.875rem; padding:0.55rem 1.3rem; white-space:nowrap;">
                ← Dashboard
            </a>
        </div>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${mensajeExito}" class="alerta alerta-exito" th:text="${mensajeExito}"></div>
    <div th:if="${errorForm}"    class="alerta alerta-error"  th:text="${errorForm}"></div>

    <!-- ── Tabla de usuarios ──────────────────────────────────────────────── -->
    <div class="tabla-card">
        <table th:if="${not #lists.isEmpty(usuarios)}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>DNI</th>
                    <th>Estado</th>
                    <th>Rol actual</th>
                    <th>Cambiar rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.idUsuario}">-</td>
                    <td>
                        <strong th:text="${usuario.nombres + ' ' + usuario.apellidos}">-</strong>
                    </td>
                    <td th:text="${usuario.email}">-</td>
                    <td th:text="${usuario.dni ?: '—'}">—</td>
                    <td>
                        <span th:if="${usuario.activo}"
                              style="color:var(--verde); font-weight:600; font-size:0.82rem;">Activo</span>
                        <span th:unless="${usuario.activo}"
                              style="color:var(--rojo); font-size:0.82rem;">Inactivo</span>
                    </td>
                    <td>
                        <span class="badge"
                              th:text="${usuario.rol.nombre}"
                              th:classappend="${usuario.rol.nombre == 'admin'       ? ' badge-confirmada' :
                                               usuario.rol.nombre == 'veterinario' ? ' badge-en-curso'   :
                                                                                     ' badge-programada'}">
                        </span>
                    </td>
                    <td>
                        <form th:action="@{/admin/usuarios/{id}/rol(id=${usuario.idUsuario})}"
                              method="post"
                              style="display:flex; gap:0.5rem; align-items:center;">
                            <select name="nuevoRol"
                                    class="campo-input"
                                    style="padding:0.25rem 0.5rem; font-size:0.82rem; width:auto;">
                                <option value="cliente"     th:selected="${usuario.rol.nombre == 'cliente'}">cliente</option>
                                <option value="veterinario" th:selected="${usuario.rol.nombre == 'veterinario'}">veterinario</option>
                                <option value="admin"       th:selected="${usuario.rol.nombre == 'admin'}">admin</option>
                            </select>
                            <button type="submit"
                                    class="btn btn-verde"
                                    style="padding:0.25rem 0.75rem; font-size:0.78rem; border:none; cursor:pointer;">
                                Guardar
                            </button>
                        </form>
                    </td>
                    <td>
                        <div style="display:flex; flex-direction:column; gap:0.3rem; align-items:flex-start;">
                            <a th:href="@{/admin/usuarios/{id}(id=${usuario.idUsuario})}"
                               class="btn btn-gris"
                               style="padding:0.25rem 0.75rem; font-size:0.78rem; width:auto;">
                                <i class="fa-solid fa-eye"></i> Ver
                            </a>
                            <a th:href="@{/admin/usuarios/{id}/editar(id=${usuario.idUsuario})}"
                               class="btn btn-outline"
                               style="padding:0.25rem 0.75rem; font-size:0.78rem; width:auto;">
                                <i class="fa-solid fa-pen-to-square"></i> Editar
                            </a>
                            <form th:if="${usuario.activo}"
                                  th:action="@{/admin/usuarios/{id}/desactivar(id=${usuario.idUsuario})}"
                                  method="post"
                                  onsubmit="return confirm('¿Desactivar a este usuario? Ya no podrá iniciar sesión.')">
                                <button type="submit"
                                        class="btn btn-rojo"
                                        style="padding:0.25rem 0.75rem; font-size:0.78rem; border:none; cursor:pointer; width:auto;">
                                    <i class="fa-solid fa-user-xmark"></i> Desactivar
                                </button>
                            </form>
                            <form th:unless="${usuario.activo}"
                                  th:action="@{/admin/usuarios/{id}/activar(id=${usuario.idUsuario})}"
                                  method="post"
                                  onsubmit="return confirm('¿Reactivar a este usuario? Podrá volver a iniciar sesión.')">
                                <button type="submit"
                                        class="btn btn-verde"
                                        style="padding:0.25rem 0.75rem; font-size:0.78rem; border:none; cursor:pointer; width:auto;">
                                    <i class="fa-solid fa-user-check"></i> Activar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="tabla-vacia" th:if="${#lists.isEmpty(usuarios)}">
            <span class="icono-vacio">👤</span>
            No hay usuarios registrados.
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
