<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="|SmartVet — ${producto.nombre}|">Ver Producto</title>
    <th:block th:insert="~{fragments/head :: head_content}"></th:block>
</head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">

    <div class="page-header" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
        <div>
            <h2 th:text="${producto.nombre}">Producto</h2>
            <p th:text="${producto.tipoProducto}">Tipo</p>
        </div>
        <a th:href="@{/admin/productos}" class="btn btn-outline" style="white-space:nowrap;">
            ← Inventario
        </a>
    </div>

    <div style="max-width:720px; margin:0 auto;">
        <div class="tabla-card" style="padding:1.75rem 2rem;">
            <p class="seccion-titulo" style="margin-top:0; margin-bottom:1.25rem;">
                <i class="fa-solid fa-box-open" style="color:var(--primario);"></i>
                Ficha del Producto
            </p>
            <dl class="ficha-grid">
                <div>
                    <dt>Tipo</dt>
                    <dd th:text="${producto.tipoProducto}">-</dd>
                </div>
                <div>
                    <dt>Stock actual</dt>
                    <dd>
                        <span th:text="${producto.stockActual}"
                              th:style="${producto.stockActual le producto.stockMinimo ?
                                          'color:var(--rojo); font-weight:700;' : 'font-weight:600;'}">0</span>
                        <span th:if="${producto.stockActual le producto.stockMinimo}"
                              style="color:var(--rojo); font-size:0.8rem; margin-left:0.4rem;">⚠ BAJO</span>
                    </dd>
                </div>
                <div>
                    <dt>Stock mínimo</dt>
                    <dd th:text="${producto.stockMinimo}">0</dd>
                </div>
                <div>
                    <dt>Precio de venta</dt>
                    <dd th:text="${'S/ ' + #numbers.formatDecimal(producto.precioVenta, 1, 2)}">-</dd>
                </div>
                <div th:if="${producto.precioCompra != null}">
                    <dt>Precio de compra</dt>
                    <dd th:text="${'S/ ' + #numbers.formatDecimal(producto.precioCompra, 1, 2)}">-</dd>
                </div>
                <div>
                    <dt>Unidad de medida</dt>
                    <dd th:text="${producto.unidadMedida ?: '—'}">—</dd>
                </div>
                <div>
                    <dt>Requiere receta</dt>
                    <dd>
                        <span th:if="${producto.requiereReceta}" class="badge badge-confirmada">Sí</span>
                        <span th:unless="${producto.requiereReceta}" style="color:var(--texto-suave);">No</span>
                    </dd>
                </div>
                <div style="grid-column: 1 / -1;"
                     th:if="${producto.descripcion != null and !producto.descripcion.isBlank()}">
                    <dt>Descripción</dt>
                    <dd th:text="${producto.descripcion}">-</dd>
                </div>
            </dl>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
