<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>SmartVet — Registrar Mascota</title>
    <th:block th:insert="~{fragments/head :: head_content}"></th:block>
    <style>
        input[type="date"]::-webkit-calendar-picker-indicator {
            display: none;
            -webkit-appearance: none;
        }
        .btn-calendario-destacado {
            background-color: #ff9800;
            color: white;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .btn-calendario-destacado:hover { background-color: #e68a00; }
        .btn-calendario-destacado i     { font-size: 1.1rem; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="main-content">

    <div class="page-header">
        <h2>Registrar Mascota</h2>
        <p>Completa los datos de tu mascota. Los campos marcados con * son obligatorios.</p>
    </div>

    <!-- Error de validación -->
    <div th:if="${errorForm}" class="alerta alerta-error" th:text="${errorForm}"></div>

    <div class="tabla-card" style="padding: 2rem;">
        <form th:action="@{/mascotas/nueva}" method="post">

            <div class="form-fila">
                <!-- Nombre -->
                <div class="form-grupo">
                    <label for="nombre">Nombre *</label>
                    <input type="text" id="nombre" name="nombre" required maxlength="100"
                           th:value="${nombrePrev}" placeholder="Ej: Firulais">
                </div>

                <!-- Especie -->
                <div class="form-grupo">
                    <label for="especie">Especie *</label>
                    <input type="text" id="especie" name="especie" required maxlength="50"
                           list="especies-lista" th:value="${especiePrev}" placeholder="Ej: Perro">
                    <datalist id="especies-lista">
                        <option value="Perro">
                        <option value="Gato">
                        <option value="Ave">
                        <option value="Conejo">
                        <option value="Hamster">
                        <option value="Reptil">
                        <option value="Otro">
                    </datalist>
                </div>
            </div>

            <div class="form-fila">
                <!-- Raza -->
                <div class="form-grupo">
                    <label for="raza">Raza <span class="hint" style="font-weight:400;">(opcional)</span></label>
                    <input type="text" id="raza" name="raza" maxlength="80"
                           th:value="${razaPrev}" placeholder="Ej: Labrador">
                </div>

                <!-- Color -->
                <div class="form-grupo">
                    <label for="color">Color <span class="hint" style="font-weight:400;">(opcional)</span></label>
                    <input type="text" id="color" name="color" maxlength="50"
                           th:value="${colorPrev}" placeholder="Ej: Dorado">
                </div>
            </div>

            <div class="form-fila">
                <!-- Fecha de nacimiento -->
                <div class="form-grupo">
                    <label for="fechaNacimiento">Fecha de nacimiento <span class="hint" style="font-weight:400;">(opcional)</span></label>
                    <div style="position:relative; display:flex; align-items:center;">
                        <span id="btn-fecha-nacimiento"
                              class="btn-calendario-destacado"
                              style="position:absolute; left:0; top:0; bottom:0; display:flex; align-items:center;
                                     padding:0 0.75rem; border-radius:var(--radio,6px) 0 0 var(--radio,6px); z-index:1;">
                            <i class="bi bi-calendar-date"></i>
                        </span>
                        <input type="date" id="fechaNacimiento" name="fechaNacimiento"
                               style="padding-left:3rem; width:100%;"
                               th:value="${fechaPrev}">
                    </div>
                    <span id="error-fecha-nac" style="color:var(--rojo,#dc2626); font-size:0.82rem; display:none;"></span>
                    <span class="hint">La fecha de nacimiento no puede ser una fecha futura.</span>
                </div>

                <!-- Sexo -->
                <div class="form-grupo">
                    <label for="sexo">Sexo *</label>
                    <select id="sexo" name="sexo" required>
                        <option value="" disabled th:selected="${sexoPrev == null}">— Selecciona —</option>
                        <option th:each="s : ${sexos}"
                                th:value="${s.name()}"
                                th:text="${s.name()}"
                                th:selected="${sexoPrev != null and sexoPrev.name() == s.name()}">
                        </option>
                    </select>
                </div>
            </div>

            <!-- Peso -->
            <div class="form-grupo" style="max-width: 280px;">
                <label for="peso">Peso (kg) <span class="hint" style="font-weight:400;">(opcional)</span></label>
                <input type="number" id="peso" name="peso" step="0.01" min="0" max="999.99"
                       th:value="${pesoPrev}" placeholder="Ej: 12.5">
                <span class="hint">Ingresa el peso en kilogramos con hasta 2 decimales.</span>
            </div>

            <hr class="divisor">

            <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                <button type="submit" class="btn btn-verde">Registrar mascota</button>
                <a th:href="@{/mascotas}" class="btn btn-outline">Cancelar</a>
            </div>

        </form>
    </div>

</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const hoy         = new Date();
    const anio        = hoy.getFullYear();
    const mes         = String(hoy.getMonth() + 1).padStart(2, '0');
    const dia         = String(hoy.getDate()).padStart(2, '0');
    const fechaActual = `${anio}-${mes}-${dia}`;

    document.querySelectorAll('input[type="date"]').forEach(function (input) {
        input.setAttribute('max', fechaActual);

        input.addEventListener('change', function () {
            if (this.value > fechaActual) {
                alert('La fecha de nacimiento no puede ser una fecha futura. Por favor, selecciona una fecha válida.');
                this.value = '';
            }
        });
    });

    const btnCal     = document.getElementById('btn-fecha-nacimiento');
    const inputFecha = document.getElementById('fechaNacimiento');
    if (btnCal && inputFecha) {
        btnCal.addEventListener('click', function () {
            try { inputFecha.showPicker(); } catch (e) { inputFecha.focus(); }
        });
    }
});
</script>

</body>
</html>
