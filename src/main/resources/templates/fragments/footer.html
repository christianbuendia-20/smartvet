<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title></title></head>
<body>

<footer th:fragment="footer" class="site-footer">

    <!-- Cuerpo del footer -->
    <div class="site-footer-body">

        <!-- Marca -->
        <a th:href="@{/}" class="site-footer-brand" style="text-decoration:none;">
            <img th:src="@{/img/logo.jpg}"
                 class="site-footer-brand-img"
                 alt="Santa Victoria"
                 onerror="this.style.display='none';">
            <div>
                <div class="site-footer-brand-name">Santa Victoria</div>
                <div class="site-footer-brand-sub">Veterinaria</div>
            </div>
        </a>

        <!-- Sedes -->
        <div class="site-footer-addresses">
            <span>
                <i class="fa-solid fa-location-dot"></i>
                Jr. Joaquin Capello 406, San Martín de Porres
            </span>
            <span>
                <i class="fa-solid fa-location-dot"></i>
                Barreda y Aguilar 174, Rímac
            </span>
        </div>

        <!-- Redes sociales -->
        <div class="site-footer-social">
            <a href="https://www.instagram.com/veterinariasantavictoria/"
               target="_blank" rel="noopener noreferrer"
               class="footer-social-btn ig"
               aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.facebook.com/profile.php?id=61580370899923"
               target="_blank" rel="noopener noreferrer"
               class="footer-social-btn fb"
               aria-label="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://www.tiktok.com/@veterinariasantavictoria"
               target="_blank" rel="noopener noreferrer"
               class="footer-social-btn tt"
               aria-label="TikTok">
                <i class="fa-brands fa-tiktok"></i>
            </a>
        </div>

    </div>

    <!-- Línea de copyright -->
    <div class="site-footer-bottom">
        <div class="site-footer-inner">
            <span>© 2025 Veterinaria Santa Victoria</span>
            <span class="site-footer-sep">·</span>
            <span>Sistema de Gestión</span>
            <span class="site-footer-sep">·</span>
            <span>
                <i class="fa-solid fa-heart" style="color: var(--primario); font-size:0.7rem;"></i>
                Lima, Perú
            </span>
        </div>
    </div>

    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('input[type="date"]').forEach(function (input) {
            /* Previene el picker nativo antes de que Flatpickr tome el control */
            input.type = 'text';

            /* Campos de nacimiento no deben aceptar fechas futuras */
            var idNombre = (input.id || '').toLowerCase();
            var nameNombre = (input.name || '').toLowerCase();
            var esNacimiento = idNombre.includes('nacimiento') || nameNombre.includes('nacimiento');
            var limiteMax = esNacimiento ? 'today' : '2099-12-31';

            /* Capturar los estilos inline antes de que Flatpickr oculte el input */
            var estilosOriginales = input.getAttribute('style') || '';

            var fp = flatpickr(input, {
                locale: 'es',
                dateFormat: 'Y-m-d',  /* formato real → backend Spring Boot */
                altInput: true,        /* input visual oculta el original    */
                altFormat: 'd/m/Y',   /* formato latino para el usuario      */
                altInputClass: input.className, /* hereda las clases del input original */
                allowInput: true,
                maxDate: limiteMax,
                disableMobile: true
            });

            /* Transferir los estilos inline al alt input para respetar el flex wrapper */
            if (fp.altInput && estilosOriginales) {
                fp.altInput.setAttribute('style', estilosOriginales);
            }

            /* Conectar cualquier span-botón naranja del mismo contenedor */
            var wrapper = input.parentElement;
            if (wrapper) {
                wrapper.querySelectorAll('span').forEach(function (span) {
                    span.style.cursor = 'pointer';
                    span.addEventListener('click', function () { fp.open(); });
                });
            }
        });
    });
    </script>

</footer>

</body>
</html>
