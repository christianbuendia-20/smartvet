<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>SmartVet — Mi Agenda</title>
    <th:block th:insert="~{fragments/head :: head_content}"></th:block>
</head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">

    <div class="page-header">
        <h2>Mi Agenda</h2>
        <p>Todas las citas asignadas a <strong sec:authentication="principal.nombreCompleto">Veterinario</strong>,
           ordenadas cronológicamente.</p>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${mensajeExito}" class="alerta alerta-exito" th:text="${mensajeExito}"></div>
    <div th:if="${errorAcceso}"  class="alerta alerta-error"  th:text="${errorAcceso}"></div>

    <!-- ── Tabla de citas ──────────────────────────────────────────────────── -->
    <div class="tabla-card">
        <table th:if="${not #lists.isEmpty(misCitas)}">
            <thead>
                <tr>
                    <th>Fecha y hora</th>
                    <th>Mascota</th>
                    <th>Propietario</th>
                    <th>Tipo</th>
                    <th>Motivo</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cita : ${misCitas}">
                    <td>
                        <strong th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy')}">-</strong>
                        <span style="color:var(--texto-suave); font-size:0.82rem;"
                              th:text="${' ' + #temporals.format(cita.fechaHora, 'HH:mm')}"></span>
                    </td>
                    <td>
                        <strong th:text="${cita.mascota.nombre}">-</strong>
                        <span style="color:var(--texto-suave); font-size:0.8rem;"
                              th:text="' (' + ${cita.mascota.especie} + ')'"></span>
                    </td>
                    <td th:text="${cita.mascota.propietario.nombres + ' ' + cita.mascota.propietario.apellidos}">-</td>
                    <td th:text="${cita.tipoCita}">-</td>
                    <td style="max-width:170px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"
                        th:text="${cita.motivo ?: '—'}">—</td>
                    <td>
                        <span class="badge"
                              th:text="${cita.estado}"
                              th:classappend="${' badge-' + cita.estado.name().toLowerCase().replace('_', '-')}">
                        </span>
                    </td>
                    <td>
                        <div style="display:flex; flex-direction:column; gap:0.35rem; align-items:flex-start;">
                            <a th:if="${cita.estado.name() == 'PROGRAMADA' or
                                        cita.estado.name() == 'CONFIRMADA'  or
                                        cita.estado.name() == 'EN_CURSO'}"
                               th:href="@{/vet/consulta/{id}(id=${cita.idCita})}"
                               class="btn btn-verde"
                               style="padding:0.3rem 0.85rem; font-size:0.82rem;">
                                Registrar consulta
                            </a>
                            <span th:if="${cita.estado.name() == 'COMPLETADA'}"
                                  style="color:var(--verde); font-size:0.82rem; font-weight:600;">
                                ✓ Completada
                            </span>
                            <span th:if="${cita.estado.name() == 'CANCELADA' or cita.estado.name() == 'NO_ASISTIO'}"
                                  style="color:var(--texto-suave); font-size:0.82rem;">—</span>
                            <a th:href="@{/vet/historial/{id}(id=${cita.mascota.idMascota})}"
                               class="btn btn-outline"
                               style="padding:0.25rem 0.75rem; font-size:0.75rem;">
                                📋 Historial
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="tabla-vacia" th:if="${#lists.isEmpty(misCitas)}">
            <span class="icono-vacio">📭</span>
            No tienes citas asignadas aún.
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
