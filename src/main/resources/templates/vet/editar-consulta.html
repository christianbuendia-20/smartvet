<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="|SmartVet — Editar Consulta #${consulta.idConsulta}|">Editar Consulta</title>
    <th:block th:insert="~{fragments/head :: head_content}"></th:block>
</head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">

    <div class="page-header" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
        <div>
            <h2 th:text="'Editar Consulta #' + ${consulta.idConsulta}">Editar Consulta</h2>
            <p th:text="${#temporals.format(consulta.fechaHora, 'dd/MM/yyyy HH:mm')}">Fecha</p>
        </div>
        <a th:href="@{/vet/consultas/{id}(id=${consulta.idConsulta})}"
           class="btn btn-outline" style="white-space:nowrap;">
            ← Volver
        </a>
    </div>

    <div class="alerta alerta-aviso">
        <i class="fa-solid fa-clock"></i>
        <strong>Ventana de edición activa.</strong>
        Solo puedes modificar esta consulta durante los primeros 60 minutos tras su registro.
        Los medicamentos de la receta no pueden alterarse una vez guardados.
    </div>

    <div th:if="${errorForm}" class="alerta alerta-error" th:text="${errorForm}"></div>

    <div style="max-width:720px; margin:0 auto;">
        <form th:action="@{/vet/consultas/{id}/editar(id=${consulta.idConsulta})}" method="post">

            <!-- Signos Vitales -->
            <div class="tabla-card" style="padding:1.75rem 2rem; margin-bottom:1.5rem;">
                <p class="seccion-titulo" style="margin-top:0; margin-bottom:1.25rem;">
                    <i class="fa-solid fa-heart-pulse" style="color:var(--primario);"></i>
                    Signos Vitales
                </p>
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:1rem;">
                    <div class="form-group">
                        <label class="form-label">Temperatura (°C)</label>
                        <input type="number" name="temperatura" class="form-input"
                               step="0.1" min="30" max="45"
                               th:value="${consulta.temperatura}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Peso (kg)</label>
                        <input type="number" name="peso" class="form-input"
                               step="0.01" min="0.01"
                               th:value="${consulta.peso}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Frec. cardíaca (lpm)</label>
                        <input type="number" name="frecuenciaCardiaca" class="form-input"
                               min="1"
                               th:value="${consulta.frecuenciaCardiaca}">
                    </div>
                </div>
            </div>

            <!-- Diagnóstico / Tratamiento / Observaciones -->
            <div class="tabla-card" style="padding:1.75rem 2rem; margin-bottom:1.5rem;">
                <p class="seccion-titulo" style="margin-top:0; margin-bottom:1.25rem;">
                    <i class="fa-solid fa-stethoscope" style="color:var(--primario);"></i>
                    Diagnóstico Clínico
                </p>
                <div class="form-group">
                    <label class="form-label">
                        Diagnóstico <span style="color:var(--rojo);">*</span>
                    </label>
                    <textarea name="diagnostico" class="form-input" rows="3" required
                              th:text="${consulta.diagnostico}"></textarea>
                </div>
                <div class="form-group" style="margin-top:1rem;">
                    <label class="form-label">Tratamiento</label>
                    <textarea name="tratamiento" class="form-input" rows="3"
                              th:text="${consulta.tratamiento}"></textarea>
                </div>
                <div class="form-group" style="margin-top:1rem;">
                    <label class="form-label">Observaciones</label>
                    <textarea name="observaciones" class="form-input" rows="2"
                              th:text="${consulta.observaciones}"></textarea>
                </div>
            </div>

            <!-- Botones -->
            <div style="display:flex; gap:1rem; margin-bottom:2rem;">
                <button type="submit" class="btn btn-primario" style="flex:1; min-width:130px;">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
                </button>
                <a th:href="@{/vet/consultas/{id}(id=${consulta.idConsulta})}"
                   class="btn btn-outline" style="flex:1; min-width:130px; text-align:center;">
                    Cancelar
                </a>
            </div>

        </form>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
