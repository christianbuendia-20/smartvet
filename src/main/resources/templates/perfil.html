<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Santa Victoria — Mi Perfil</title>
    <th:block th:insert="~{fragments/head :: head_content}"></th:block>
</head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">

    <div class="page-header" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;">
        <div>
            <h2>Mi Perfil</h2>
            <p>Administra tu información personal</p>
        </div>
        <a th:href="@{/}" class="btn btn-outline">← Volver</a>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${mensajeExito}" class="alerta alerta-exito" th:text="${mensajeExito}"></div>
    <div th:if="${errorForm}"    class="alerta alerta-error"  th:text="${errorForm}"></div>

    <div style="max-width:760px; margin:0 auto;">
        <form th:action="@{/perfil/actualizar}" method="post" novalidate>

            <!-- ── Tarjeta 1: Datos Personales ───────────────────────────── -->
            <div class="tabla-card" style="margin-bottom:1.5rem; padding:1.75rem 2rem;">
                <p class="seccion-titulo" style="margin-top:0; margin-bottom:1.25rem;">
                    <i class="fa-solid fa-user" style="color:var(--primario);"></i>
                    Datos Personales
                </p>

                <div class="form-fila" style="gap:1.25rem;">
                    <div class="form-grupo" style="margin-bottom:1.4rem;">
                        <label for="nombres">
                            Nombres <span style="color:var(--rojo);">*</span>
                        </label>
                        <input type="text" id="nombres" name="nombres"
                               th:value="${nombresPrev ?: usuario.nombres}" required>
                    </div>
                    <div class="form-grupo" style="margin-bottom:1.4rem;">
                        <label for="apellidos">
                            Apellidos <span style="color:var(--rojo);">*</span>
                        </label>
                        <input type="text" id="apellidos" name="apellidos"
                               th:value="${apellidosPrev ?: usuario.apellidos}" required>
                    </div>
                </div>

                <div class="form-grupo" style="margin-bottom:1.4rem;">
                    <label for="email">
                        Correo electrónico <span style="color:var(--rojo);">*</span>
                    </label>
                    <input type="email" id="email" name="email"
                           th:value="${emailPrev ?: usuario.email}"
                           autocomplete="email" required>
                </div>

                <div class="form-fila" style="gap:1.25rem;">
                    <div class="form-grupo" style="margin-bottom:0;">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono"
                               th:value="${telefonoPrev ?: usuario.telefono}"
                               placeholder="999 888 777">
                    </div>
                    <div class="form-grupo" style="margin-bottom:0;">
                        <label for="dni">DNI</label>
                        <input type="text" id="dni" name="dni"
                               th:value="${dniPrev ?: usuario.dni}"
                               maxlength="20">
                    </div>
                </div>
            </div>

            <!-- ── Tarjeta 2: Dirección ───────────────────────────────────── -->
            <div class="tabla-card" style="margin-bottom:1.75rem; padding:1.75rem 2rem;">
                <p class="seccion-titulo" style="margin-top:0; margin-bottom:1.25rem;">
                    <i class="fa-solid fa-location-dot" style="color:var(--primario);"></i>
                    Dirección
                </p>

                <div class="form-grupo" style="margin-bottom:1.4rem;">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion"
                           th:value="${direccionPrev ?: direccionActual?.direccion}"
                           placeholder="Ej: Av. Los Olivos 123, San Martín de Porres">
                    <span class="hint">Opcional. Tu dirección de domicilio.</span>
                </div>

                <div class="form-grupo" style="margin-bottom:0;">
                    <label for="referencia">Referencia</label>
                    <textarea id="referencia" name="referencia" rows="2"
                              placeholder="Ej: Frente al parque, casa color azul"
                              th:text="${referenciaPrev ?: direccionActual?.referencia}"></textarea>
                    <span class="hint">Opcional. Puntos de referencia para llegar.</span>
                </div>
            </div>

            <!-- ── Acciones ───────────────────────────────────────────────── -->
            <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
                <a th:href="@{/}" class="btn btn-outline"
                   style="flex:1; min-width:130px; text-align:center;">Cancelar</a>
                <button type="submit" class="btn btn-primario"
                        style="flex:1; min-width:130px;">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar cambios
                </button>
            </div>

        </form>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
