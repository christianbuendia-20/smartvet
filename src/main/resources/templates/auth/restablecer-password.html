<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Santa Victoria — Nueva contraseña</title>
    <th:block th:insert="~{fragments/head :: head_content}"></th:block>
</head>
<body>

<div class="auth-page">
    <div class="auth-card" style="max-width:460px;">

        <!-- Marca -->
        <div class="auth-brand">
            <img th:src="@{/img/logo.jpg}"
                 class="auth-logo-img"
                 alt="Veterinaria Santa Victoria"
                 onerror="this.style.display='none'; document.getElementById('authLogoFallback').style.display='flex';">
            <div id="authLogoFallback" class="auth-logo-fallback" style="display:none;">🐾</div>
            <h1>Santa Victoria</h1>
            <span class="auth-brand-sub">Veterinaria</span>
        </div>

        <!-- Instrucciones -->
        <div style="text-align:center; margin-bottom:1.5rem;">
            <div style="font-size:2.75rem; margin-bottom:0.75rem; color:var(--primario);">
                <i class="fa-solid fa-key"></i>
            </div>
            <p class="auth-titulo" style="margin-bottom:0.5rem;">Nueva contraseña</p>
            <p style="font-size:0.9rem; color:#6B6B6B; line-height:1.65; margin:0;">
                Elige una contraseña segura de al menos <strong>8 caracteres</strong>.
            </p>
        </div>

        <!-- Mensajes flash -->
        <div class="alerta alerta-error" th:if="${errorForm}" th:text="${errorForm}"></div>

        <form th:action="@{/restablecer-password}" method="post" novalidate>

            <div class="form-grupo">
                <label for="nuevaContrasena">
                    <i class="fa-solid fa-lock" style="color:var(--primario);"></i>
                    Nueva contraseña
                </label>
                <div style="position:relative;">
                    <input type="password"
                           id="nuevaContrasena"
                           name="nuevaContrasena"
                           placeholder="Mínimo 8 caracteres"
                           autocomplete="new-password"
                           minlength="8"
                           style="padding-right:2.75rem;"
                           required>
                    <button type="button" id="togglePassword"
                            style="position:absolute; right:0.75rem; top:50%; transform:translateY(-50%);
                                   background:none; border:none; cursor:pointer; color:var(--texto-suave);
                                   padding:0; line-height:1; font-size:1rem;">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                <span class="hint">
                    <i class="fa-solid fa-circle-info" style="color:var(--primario);"></i>
                    Mínimo 8 caracteres
                </span>
            </div>

            <div style="display:flex; gap:1rem; margin-top:1.25rem;">
                <a th:href="@{/auth/login}" class="btn btn-outline"
                   style="flex:1; text-align:center; white-space:nowrap;">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primario" style="flex:1; white-space:nowrap;">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Guardar
                </button>
            </div>

        </form>

    </div>
</div>

<script>
document.getElementById('togglePassword').addEventListener('click', function () {
    var inp = document.getElementById('nuevaContrasena');
    var ico = this.querySelector('i');
    if (inp.type === 'password') {
        inp.type = 'text';
        ico.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        inp.type = 'password';
        ico.classList.replace('fa-eye-slash', 'fa-eye');
    }
});
</script>
</body>
</html>
