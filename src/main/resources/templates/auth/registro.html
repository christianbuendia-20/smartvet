<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Santa Victoria — Crear cuenta</title>
    <th:block th:insert="~{fragments/head :: head_content}"></th:block>
</head>
<body>

<div class="auth-page">
    <div class="auth-card" style="max-width: 520px;">

        <!-- Marca -->
        <div class="auth-brand">
            <img th:src="@{/img/logo.jpg}"
                 class="auth-logo-img"
                 alt="Veterinaria Santa Victoria"
                 onerror="this.style.display='none'; document.getElementById('authLogoFallback').style.display='flex';">
            <div id="authLogoFallback" class="auth-logo-fallback" style="display:none;">🐾</div>
            <h1>Santa Victoria</h1>
            <span class="auth-brand-sub">Veterinaria</span>
            <p>Crea tu cuenta de cliente</p>
        </div>

        <!-- Error de registro (email duplicado o fallo de envío) -->
        <div class="alerta alerta-error"
             th:if="${errorRegistro}"
             th:text="${errorRegistro}">
        </div>

        <p class="auth-titulo">Datos personales</p>

        <form th:action="@{/auth/registro}" method="post" novalidate
              th:object="${registroForm}">

            <div class="form-fila">
                <div class="form-grupo">
                    <label for="nombres">
                        Nombres <span style="color:var(--rojo)">*</span>
                    </label>
                    <input type="text"
                           id="nombres"
                           name="nombres"
                           th:value="*{nombres}"
                           placeholder="Ana María"
                           required>
                    <span class="hint" style="color:var(--rojo);"
                          th:if="${#fields.hasErrors('nombres')}"
                          th:errors="*{nombres}"></span>
                </div>
                <div class="form-grupo">
                    <label for="apellidos">
                        Apellidos <span style="color:var(--rojo)">*</span>
                    </label>
                    <input type="text"
                           id="apellidos"
                           name="apellidos"
                           th:value="*{apellidos}"
                           placeholder="García López"
                           required>
                    <span class="hint" style="color:var(--rojo);"
                          th:if="${#fields.hasErrors('apellidos')}"
                          th:errors="*{apellidos}"></span>
                </div>
            </div>

            <div class="form-grupo">
                <label for="email">
                    Correo electrónico <span style="color:var(--rojo)">*</span>
                </label>
                <input type="email"
                       id="email"
                       name="email"
                       th:value="*{email}"
                       placeholder="tucorreo@ejemplo.com"
                       autocomplete="email"
                       required>
                <span class="hint" style="color:var(--rojo);"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"></span>
            </div>

            <div class="form-fila">
                <div class="form-grupo">
                    <label for="dni">DNI</label>
                    <input type="text"
                           id="dni"
                           name="dni"
                           th:value="*{dni}"
                           placeholder="12345678"
                           maxlength="20">
                    <span class="hint">Opcional</span>
                </div>
                <div class="form-grupo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel"
                           id="telefono"
                           name="telefono"
                           th:value="*{telefono}"
                           placeholder="999 888 777">
                    <span class="hint">Opcional</span>
                </div>
            </div>

            <div class="form-grupo">
                <label for="password">
                    Contraseña <span style="color:var(--rojo)">*</span>
                </label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Mínimo 8 caracteres"
                       autocomplete="new-password"
                       minlength="8"
                       required>
                <span class="hint" style="color:var(--rojo);"
                      th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}"></span>
                <span class="hint"
                      th:unless="${#fields.hasErrors('password')}">
                    <i class="fa-solid fa-circle-info" style="color:var(--primario);"></i>
                    Mínimo 8 caracteres
                </span>
            </div>

            <button type="submit" class="btn btn-primario">
                <i class="fa-solid fa-user-plus"></i>
                Crear cuenta
            </button>
        </form>

        <hr class="divisor">

        <p class="auth-footer">
            ¿Ya tienes cuenta?
            <a th:href="@{/auth/login}">Inicia sesión aquí</a>
        </p>

    </div>
</div>

</body>
</html>
