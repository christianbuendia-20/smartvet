<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='SmartVet — Crear cuenta')}"></head>
<body>

<div class="auth-page">
    <div class="auth-card" style="max-width: 520px;">

        <!-- Marca -->
        <div class="auth-brand">
            <div class="logo">🐾</div>
            <h1>SmartVet</h1>
            <p>Crear una cuenta de cliente</p>
        </div>

        <!-- Error de registro (email duplicado, etc.) -->
        <div class="alerta alerta-error"
             th:if="${errorRegistro}"
             th:text="${errorRegistro}">
        </div>

        <p class="auth-titulo">Datos personales</p>

        <form th:action="@{/auth/registro}" method="post" novalidate>

            <div class="form-fila">
                <div class="form-grupo">
                    <label for="nombres">Nombres <span style="color:var(--rojo)">*</span></label>
                    <input type="text"
                           id="nombres"
                           name="nombres"
                           th:value="${nombresPrevio}"
                           placeholder="Ana María"
                           required>
                </div>
                <div class="form-grupo">
                    <label for="apellidos">Apellidos <span style="color:var(--rojo)">*</span></label>
                    <input type="text"
                           id="apellidos"
                           name="apellidos"
                           th:value="${apellidosPrevio}"
                           placeholder="García López"
                           required>
                </div>
            </div>

            <div class="form-grupo">
                <label for="email">Correo electrónico <span style="color:var(--rojo)">*</span></label>
                <input type="email"
                       id="email"
                       name="email"
                       th:value="${emailPrevio}"
                       placeholder="tucorreo@ejemplo.com"
                       autocomplete="email"
                       required>
            </div>

            <div class="form-fila">
                <div class="form-grupo">
                    <label for="dni">DNI</label>
                    <input type="text"
                           id="dni"
                           name="dni"
                           th:value="${dniPrevio}"
                           placeholder="12345678"
                           maxlength="20">
                    <span class="hint">Opcional</span>
                </div>
                <div class="form-grupo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel"
                           id="telefono"
                           name="telefono"
                           th:value="${telefonoPrevio}"
                           placeholder="999 888 777">
                    <span class="hint">Opcional</span>
                </div>
            </div>

            <div class="form-grupo">
                <label for="password">Contraseña <span style="color:var(--rojo)">*</span></label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Mínimo 8 caracteres"
                       autocomplete="new-password"
                       minlength="8"
                       required>
                <span class="hint">Mínimo 8 caracteres</span>
            </div>

            <button type="submit" class="btn btn-primario">Crear cuenta</button>
        </form>

        <hr class="divisor">

        <p class="auth-footer">
            ¿Ya tiene cuenta?
            <a th:href="@{/auth/login}">Inicie sesión aquí</a>
        </p>

    </div>
</div>

</body>
</html>
