<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='SmartVet — Iniciar sesión')}"></head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <!-- Marca -->
        <div class="auth-brand">
            <div class="logo">🐾</div>
            <h1>SmartVet</h1>
            <p>Sistema de Gestión Veterinaria</p>
        </div>

        <!-- Mensaje de éxito: registro nuevo o cierre de sesión -->
        <div class="alerta alerta-exito"
             th:if="${mensajeExito}"
             th:text="${mensajeExito}">
        </div>
        <div class="alerta alerta-exito"
             th:if="${param.logout}">
            Sesión cerrada correctamente.
        </div>

        <!-- Error de credenciales (redirigido por Spring Security con ?error) -->
        <div class="alerta alerta-error"
             th:if="${param.error}">
            Correo o contraseña incorrectos. Intente de nuevo.
        </div>

        <p class="auth-titulo">Iniciar sesión</p>

        <form th:action="@{/auth/login}" method="post" novalidate>

            <div class="form-grupo">
                <label for="email">Correo electrónico</label>
                <input type="email"
                       id="email"
                       name="email"
                       th:value="${emailPrevio}"
                       placeholder="tucorreo@ejemplo.com"
                       autocomplete="email"
                       required>
            </div>

            <div class="form-grupo">
                <label for="password">Contraseña</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="••••••••"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="btn btn-primario">Iniciar sesión</button>
        </form>

        <hr class="divisor">

        <p class="auth-footer">
            ¿No tiene cuenta?
            <a th:href="@{/auth/registro}">Regístrese aquí</a>
        </p>

    </div>
</div>

</body>
</html>
