<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Santa Victoria — Recuperar contraseña</title>
    <th:block th:insert="~{fragments/head :: head_content}"></th:block>
</head>
<body>

<div class="auth-page">
    <div class="auth-card" style="max-width:460px;">

        <!-- Marca -->
        <div class="auth-brand">
            <img th:src="@{/img/logo.jpg}"
                 class="auth-logo-img"
                 alt="Veterinaria Santa Victoria"
                 onerror="this.style.display='none'; document.getElementById('authLogoFallback').style.display='flex';">
            <div id="authLogoFallback" class="auth-logo-fallback" style="display:none;">🐾</div>
            <h1>Santa Victoria</h1>
            <span class="auth-brand-sub">Veterinaria</span>
        </div>

        <!-- Volver al login -->
        <div style="margin-bottom:1.25rem;">
            <a th:href="@{/auth/login}" class="btn btn-outline"
               style="width:100%; justify-content:center; gap:0.6rem;">
                <i class="fa-solid fa-arrow-left"></i>
                Volver a iniciar sesión
            </a>
        </div>

        <!-- Mensajes flash -->
        <div class="alerta alerta-error" th:if="${errorForm}" th:text="${errorForm}"></div>

        <!-- Instrucciones -->
        <div style="text-align:center; margin-bottom:1.5rem;">
            <div style="font-size:2.75rem; margin-bottom:0.75rem; color:var(--primario);">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <p class="auth-titulo" style="margin-bottom:0.5rem;">¿Olvidaste tu contraseña?</p>
            <p style="font-size:0.9rem; color:#6B6B6B; line-height:1.65; margin:0;">
                Ingresa el correo asociado a tu cuenta y te enviaremos<br>
                un código de verificación de <strong>6 dígitos</strong>.
            </p>
        </div>

        <form th:action="@{/recuperar-password}" method="post">

            <div class="form-grupo">
                <label for="email">
                    <i class="fa-regular fa-envelope" style="color:var(--primario);"></i>
                    Correo electrónico
                </label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="tucorreo@ejemplo.com"
                       autocomplete="email"
                       autofocus
                       required>
                <span class="hint">
                    <i class="fa-solid fa-circle-info" style="color:var(--primario);"></i>
                    Te enviaremos un código si el correo está registrado
                </span>
            </div>

            <button type="submit" class="btn btn-primario">
                <i class="fa-solid fa-paper-plane"></i>
                Enviar código de recuperación
            </button>

        </form>

    </div>
</div>

</body>
</html>
